      <path d="M430.2 536.7 L406.5 563.7" stroke="#27b069" stroke-width="56.0"/>
      <path d="M406.5 563.7 L382.8 590.8" stroke="#28b46b" stroke-width="58.4"/>
      <path d="M382.8 590.8 L359.1 617.8" stroke="#28b86d" stroke-width="60.8"/>
      <path d="M359.1 617.8 L338.1 641.9" stroke="#29bc70" stroke-width="63.3"/>
      <path d="M338.1 641.9 L317.0 665.9" stroke="#2ac071" stroke-width="65.5"/>
      <path d="M317.0 665.9 L296.0 690.0" stroke="#2ac373" stroke-width="67.9"/>
