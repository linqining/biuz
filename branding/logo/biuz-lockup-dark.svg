      <path d="M150 242 L182 242" stroke="#102b1f" stroke-width="16"/>
      <path d="M214 242 L262 242" stroke="#143f2b" stroke-width="22"/>
      <path d="M300 242 L360 242" stroke="#175637" stroke-width="28"/>
    </g>
