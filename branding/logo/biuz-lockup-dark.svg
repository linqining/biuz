    <!-- biu 亮核 -->
    <circle cx="736" cy="690" r="140" fill="#32f08c" opacity="0.38" filter="url(#lk-blurL)"/>
    <circle cx="736" cy="690" r="104" fill="url(#lk-head)"/>
    <circle cx="700" cy="644" r="24" fill="#ffffff" opacity="0.2" filter="url(#lk-blurS)"/>
    <circle cx="700" cy="644" r="10" fill="#ffffff" opacity="0.85" filter="url(#lk-blurXS)"/>
  </g>

  <text x="124" y="448" font-family="'PingFang SC','Heiti SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="500" letter-spacing="2" fill="#8a8f9b">手机上的 AI Agent 遥控台</text>
</svg>
