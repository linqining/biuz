<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <!-- BiuZ 横版字标 · 深色(令牌: bg #0a0b0d / text #f5f9fe / text3 #8a8f9b / accent #32f08c)
       字标为纯矢量路径, 不依赖字体; i 圆点为绿色发光灯, 与彗星亮核呼应 -->
  <defs>
    <radialGradient id="lk-head" cx="36%" cy="32%" r="78%">
      <stop offset="0" stop-color="#eafff4"/>
      <stop offset=".22" stop-color="#8ff8c0"/>
      <stop offset=".55" stop-color="#32f08c"/>
      <stop offset="1" stop-color="#1ba968"/>
    </radialGradient>
    <filter id="lk-blurS" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="lk-blurXS" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="lk-blurL" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1100" height="560" rx="36" fill="#0a0b0d"/>

  <!-- 字标 Biu (cap 高 216, 基线 y=334, 起点 x=120) -->
  <g transform="translate(120,118)">
    <!-- B -->
    <path fill="#f5f9fe" fill-rule="evenodd" d="
      M0,23 C0,10 10,0 23,0 H92 C124,0 146,18 146,47 C146,72 132,89 112,95
      C138,102 158,122 158,156 C158,194 132,216 96,216 H23 C10,216 0,206 0,193 Z
      M46,38 H86 C100,38 107,44 107,55 C107,66 100,72 86,72 H46 Z
      M46,130 H88 C106,130 114,139 114,154 C114,171 106,180 88,180 H46 Z"/>
    <!-- i: 灯点 + 短杆 -->
    <circle cx="219" cy="62" r="52" fill="#32f08c" opacity=".14"/>
    <circle cx="219" cy="62" r="40" fill="#32f08c" opacity=".26"/>
    <circle cx="219" cy="62" r="30" fill="#32f08c"/>
    <circle cx="219" cy="62" r="13" fill="#eafff4" opacity=".9"/>
    <path d="M219,127 V193" stroke="#f5f9fe" stroke-width="46" stroke-linecap="round" fill="none"/>
    <!-- u -->
    <path d="M299,23 V150 A56,56 0 0 0 411,150 V23" stroke="#f5f9fe" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 彗星 Z: 作为字标的字母 Z -->
  <g transform="translate(575,8) scale(0.42)">
    <!-- 尾迹断点: 速度线 -->
