    <g fill="none" stroke-linecap="round">
      <path d="M398.0 242.0 L433.8 242.0" stroke="#195d3b" stroke-width="30.0"/>
      <path d="M433.8 242.0 L469.5 242.0" stroke="#1a623e" stroke-width="30.3"/>
      <path d="M469.5 242.0 L505.3 242.0" stroke="#1b6741" stroke-width="30.8"/>
