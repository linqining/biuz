<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- BiuZ app icon, 圆角预览版(rx=228 对应 iOS 裁切比例), 仅用于展示 -->
  <defs>
    <radialGradient id="bgGlow" cx="60%" cy="62%" r="78%">
      <stop offset="0" stop-color="#0f1214"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </radialGradient>
    <radialGradient id="head" cx="36%" cy="32%" r="78%">
      <stop offset="0" stop-color="#eafff4"/>
      <stop offset=".22" stop-color="#8ff8c0"/>
      <stop offset=".55" stop-color="#32f08c"/>
      <stop offset="1" stop-color="#1ba968"/>
    </radialGradient>
    <filter id="blurS" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blurXS" x="-160%" y="-160%" width="420%" height="420%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="blurL" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="blurXL" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="screen"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <ellipse cx="620" cy="560" rx="340" ry="310" fill="#32f08c" opacity=".14" filter="url(#blurXL)"/>

